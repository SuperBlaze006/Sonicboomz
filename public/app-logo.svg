<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Black Background -->
  <rect width="512" height="512" fill="#060608" rx="64" />
  
  <!-- Outer Subtle Ambient Red Glow -->
  <circle cx="256" cy="256" r="210" fill="#7f0d19" opacity="0.35" />

  <!-- Main Deep Crimson Red Circular Badge -->
  <radialGradient id="redGrad" cx="45%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#a81220" />
    <stop offset="60%" stop-color="#7a0914" />
    <stop offset="100%" stop-color="#4e030b" />
  </radialGradient>
  <circle cx="256" cy="256" r="195" fill="url(#redGrad)" stroke="#280307" stroke-width="6" />

  <!-- Three Curved Black Sound Wave Arcs (Sonic Waves) -->
  <!-- Top Arc -->
  <path d="M 120 185 C 200 155 312 155 392 185" fill="none" stroke="#08080c" stroke-width="28" stroke-linecap="round" />
  <!-- Middle Arc -->
  <path d="M 135 240 C 205 215 307 215 377 240" fill="none" stroke="#08080c" stroke-width="26" stroke-linecap="round" />
  <!-- Bottom Arc -->
  <path d="M 155 295 C 215 275 297 275 357 295" fill="none" stroke="#08080c" stroke-width="24" stroke-linecap="round" />

  <!-- Centered Hanging Spider Web Strand -->
  <line x1="256" y1="120" x2="256" y2="215" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />

  <!-- Large, Crisp, Centered Upside-Down Spider-Man Mask & Emblem -->
  <g transform="translate(256, 280)">
    <!-- Clenched Web Grip at top -->
    <ellipse cx="0" cy="-65" rx="10" ry="7" fill="#121218" />
    <path d="M -9 -65 Q 0 -72 9 -65 Q 5 -58 -9 -65 Z" fill="#dc2626" />

    <!-- Inverted Arms Clutched on Web -->
    <path d="M -18 -45 C -34 -30 -42 -5 -30 18 C -22 8 -16 -10 -14 -28 Z" fill="#121218" stroke="#000000" stroke-width="2" />
    <path d="M -26 -18 Q -32 -8 -24 -2 Z" fill="#dc2626" />
    <path d="M 18 -45 C 34 -30 42 -5 30 18 C 22 8 16 -10 14 -28 Z" fill="#121218" stroke="#000000" stroke-width="2" />
    <path d="M 26 -18 Q 32 -8 24 -2 Z" fill="#dc2626" />

    <!-- Inverted Shoulders & Upper Chest -->
    <path d="M -30 -10 C -42 12 -45 42 -35 60 C -20 70 20 70 35 60 C 45 42 42 12 30 -10 Z" fill="#14141c" stroke="#000000" stroke-width="2.5" />

    <!-- Red Chest Spider Emblem -->
    <ellipse cx="0" cy="18" rx="5" ry="8" fill="#ef4444" />
    <path d="M -3 14 Q -16 5 -20 -8 M -3 18 Q -20 15 -24 8 M -3 22 Q -20 30 -22 40 M -3 25 Q -14 36 -16 48" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 3 14 Q 16 5 20 -8 M 3 18 Q 20 15 24 8 M 3 22 Q 20 30 22 40 M 3 25 Q 14 36 16 48" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Mask Outer Outline & Black Suit Base -->
    <ellipse cx="0" cy="62" rx="28" ry="34" fill="#121218" stroke="#000000" stroke-width="3" />

    <!-- Red Webbing Contour Lines on Mask -->
    <path d="M -20 40 Q 0 35 20 40" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M -26 62 Q 0 56 26 62" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M -22 82 Q 0 76 22 82" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 32 L 0 94" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Big Iconic White Spider-Man Eyes (Inverted Slanted Triangle Eyes) -->
    <!-- Left Eye Black Border -->
    <path d="M -22 55 C -20 44 -8 42 -3 56 C -6 68 -18 73 -22 55 Z" fill="#000000" stroke="#dc2626" stroke-width="1.5" />
    <!-- Left Eye Pure White Fill -->
    <path d="M -20 55 C -18 46 -9 44 -5 56 C -7 66 -17 70 -20 55 Z" fill="#ffffff" />

    <!-- Right Eye Black Border -->
    <path d="M 22 55 C 20 44 8 42 3 56 C 6 68 18 73 22 55 Z" fill="#000000" stroke="#dc2626" stroke-width="1.5" />
    <!-- Right Eye Pure White Fill -->
    <path d="M 20 55 C 18 46 9 44 5 56 C 7 66 17 70 20 55 Z" fill="#ffffff" />
  </g>
</svg>
